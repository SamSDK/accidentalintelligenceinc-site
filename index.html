<!doctype html>

<head>
<meta charset="utf-8">

<meta property="og:title" content="Accidental Intelligence Inc">

<meta name="theme-color" content="#0e0e0e">
<style>
  :root {
    --bg: #0e0e0e;
    --fg: #eaeaea;
    --muted: #8a8a8a;
    --accent: #eaeaea;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 480px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
    margin: 0 0 32px;
  }
  a.cta {
    display: inline-block;
    color: var(--bg);
    background: var(--accent);
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 8px;
    transition: opacity 0.15s ease;
  }
  a.cta:hover { opacity: 0.85; }
  footer {
    margin-top: 48px;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <h1>Accidental Intelligence Inc</h1>
  <p>We make software. First up: Desker — organize your Windows desktop into live panels and icon zones.</p>
  <a class="cta" href="https://samsdk.github.io/desker-site/">See Desker →</a>
  <footer>&copy; 2026 Accidental Intelligence Inc</footer>
</main>
</body>
